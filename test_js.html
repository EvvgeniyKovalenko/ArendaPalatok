    <script>


        const catalog = [
            { id: 1, name: 'Палатка 4-местная', price: 500, deposit: 500 },
            { id: 2, name: 'Палатка 2-местная', price: 400, deposit: 400 },
            { id: 3, name: 'Спальник -5°C', price: 300, deposit: 300 },
            { id: 4, name: 'Стул раскладной', price: 150, deposit: 150 }
        ];

        let cart = [];

        //пребирает массив и пушит дивы в целевой контейнер


        function renderCard() {
            const form = document.getElementById('form')
            form.innerHTML = ''
            catalog.map(item => {
                const div = document.createElement('div')
                div.className = 'card'
                div.innerHTML =
                    `
                <div class="info">
                    <h3>${item.name}</h3>
                    <span>Залог: ${item.deposit}₽</span>
                </div>
                <div>
                    <span class="price">${item.price}₽/сутки</span>
                    <button onclick="addToCart(${item.id})" style="margin-left: 12px;">+</button>
                </div>
            `;
                form.appendChild(div)
            })
        };
        renderCard();

        //корзина

        window.addToCart = function (id) {
            const card = catalog.find(i => i.id === id);
            const exist = cart.find(i => i.id === id);
            if (exist) {
                exist.qnt += 1;
            } else {
                cart.push({ ...card, qnt: 1 })
            }
            console.log(cart)
        };

        function delFromCart(id) {

        }



    </script>
